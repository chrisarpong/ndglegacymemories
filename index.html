<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;font-family:'Manrope',system-ui,sans-serif;overflow:hidden}
:root{--gold:#c8a45d}
.stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
video,.fallback{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity 1.2s ease}
.fallback{display:none;align-items:center;justify-content:center}
.fallback img{width:min(560px,72%);opacity:0;transform:scale(.94);transition:opacity 2.5s ease,transform 5s ease}
.fallback.run img{opacity:1;transform:scale(1)}
.shade{position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.85));opacity:0;transition:opacity 1.2s ease;pointer-events:none}
.band{position:absolute;left:0;right:0;bottom:0;height:clamp(110px,20vh,200px);overflow:hidden;opacity:0;animation:fadein 1.5s ease .6s forwards;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;gap:10px;height:100%;width:max-content;animation:rl 8s linear infinite;will-change:transform}
.track img{height:100%;width:auto;flex:none;opacity:.8}
@keyframes rl{to{transform:translateX(-50%)}}
@keyframes fadein{to{opacity:1}}

.enter{position:absolute;left:0;right:0;bottom:calc(clamp(110px,20vh,200px) + 28px);text-align:center;padding:0 24px;opacity:0;transform:translateY(12px);transition:opacity 1.2s ease,transform 1.2s ease;pointer-events:none}
.enter h1{font:600 clamp(1.6rem,4vw,2.6rem)/1.15 'Cormorant Garamond',Georgia,serif;margin-bottom:22px}
.btn{display:inline-block;padding:15px 38px;background:var(--gold);color:#0b0d12;font:600 .95rem 'Manrope',sans-serif;text-decoration:none;border-radius:2px;transition:background .2s}
.btn:hover{background:#d8b872}
.sub{display:block;margin-top:18px;font-size:.85rem;color:#b9b5aa}
.sub a{color:#d9d6cd;text-decoration:none;border-bottom:1px solid rgba(200,164,93,.5)}
.done .shade,.done .enter{opacity:1;transform:none}
.done .enter{pointer-events:auto}
.skip{position:absolute;top:max(20px,env(safe-area-inset-top));right:20px;background:none;border:1px solid rgba(255,255,255,.35);color:#e8e5dc;padding:8px 18px;border-radius:30px;font:600 .8rem 'Manrope',sans-serif;cursor:pointer;transition:opacity .6s,background .2s}
.skip:hover{background:rgba(255,255,255,.12)}
.done .skip{opacity:0;pointer-events:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media(max-height:420px) and (orientation:landscape){
 .band{height:clamp(72px,22vh,90px)}
 .enter{bottom:calc(clamp(72px,22vh,90px) + 10px)}
 .enter h1{margin-bottom:10px}
 .btn{padding:11px 28px}
 .sub{margin-top:8px}
}

</style>
</head>
<body>
<main class="stage" id="stage">
 <video id="v" muted playsinline preload="auto" aria-label="NDG+ Legacy Memorials logo reveal"><source src="assets/ndg-logo-reveal.mp4" type="video/mp4"></video>
 <div class="fallback" id="fb"><img src="assets/ndg-logo.png" alt="NDG+ Legacy Memorials"></div>
 <div class="shade"></div>
<div class="band" aria-hidden="true"><div class="track" id="track">
  <img src="assets/obituary-poster.jpg" alt=""><img src="assets/brochure-black-gold.jpg" alt=""><img src="assets/tshirt.jpg" alt=""><img src="assets/rollup-heritage.jpg" alt=""><img src="assets/memorial-book.jpg" alt=""><img src="assets/invitation.jpg" alt=""><img src="assets/keepsake-box.jpg" alt=""><img src="assets/thank-you.jpg" alt=""><img src="assets/obituary-a1.jpg" alt=""><img src="assets/mugs.jpg" alt="">
 </div></div>
 <button class="skip" id="skip">Skip intro</button>
 <div class="enter">
  <h1 id="line">Honouring lives. Preserving legacies.</h1>
  <a class="btn" id="go" href="home.html">Enter site</a>
  <span class="sub">Need help now? <a href="https://wa.me/233200968878">WhatsApp 020 096 8878</a></span>
 </div>
</main>
<script>
(function(){
 const tr=document.getElementById('track');
 [...tr.children].forEach(i=>tr.appendChild(i.cloneNode()));
 function speed(){const half=tr.scrollWidth/2;if(half>0)tr.style.animationDuration=(half/520)+'s'}
 addEventListener('load',speed);
})();
(function(){
 const st=document.getElementById('stage'),v=document.getElementById('v'),fb=document.getElementById('fb');
 let finished=false;
 const finish=()=>{if(finished)return;finished=true;st.classList.add('done');setTimeout(()=>document.getElementById('go').focus({preventScroll:true}),1300)};
 const enter=()=>{location.href='home.html'};
 document.getElementById('skip').addEventListener('click',enter);
 const useFallback=()=>{v.style.display='none';fb.style.display='flex';requestAnimationFrame(()=>fb.classList.add('run'));setTimeout(finish,3800)};
 v.addEventListener('error',useFallback,true);
 v.addEventListener('ended',finish);
 setTimeout(()=>{if(!finished&&v.paused)useFallback()},4000);
 setTimeout(finish,15000);
 const p=v.play();if(p&&p.catch)p.catch(useFallback);
 document.addEventListener('keydown',e=>{if(e.key==='Escape')enter()});
})();
</script>
</body>
</html>
